[workspace]
members = [
    "ui",
    "agent", 
    "control"
]

resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
gpui = "0.2"
gpui-component = "0.2"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
